name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Install MCP server dependencies
        # bundle:mcp(esbuild)가 controller-mcp의 의존성을 해석해야 단일 파일로 번들된다.
        # node_modules 자체는 VSIX에 실리지 않으므로(번들 산출물 out/mcp/*.cjs만 포함)
        # 리눅스 러너에서 설치해도 CLAUDE.md 하드 규칙 5(윈도우 작업본에 유닉스 심링크를
        # 만들지 않는다)와 무관하다 — 그 규칙은 로컬 Windows 체크아웃에 대한 것이다.
        working-directory: controller-mcp
        run: npm ci

      - name: Package VSIX
        run: npm run package:no-bump

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ $VERSION =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ package.json ($PACKAGE_VERSION) ≠ tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Extract changelog
        run: node scripts/extract-changelog.js "${{ steps.version.outputs.version }}" > release_notes.md

      - name: Delete existing release if present
        run: gh release delete "v${{ steps.version.outputs.version }}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GPL Language Support v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: dist/*.vsix
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
